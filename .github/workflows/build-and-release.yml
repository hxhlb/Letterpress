name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Xcode 16.2
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Install dependencies
      run: |
        # Install xcbeautify for build output formatting
        # Install ldid for iOS code signing
        # Install 7zip for compression
        brew install xcbeautify ldid-procursus p7zip
    
    - name: Checkout theos
      uses: actions/checkout@v4
      with:
        repository: OwnGoalStudio/theos
        ref: fixture/letterpress
        path: theos
        submodules: recursive
    
    - name: Run compile script
      run: ./devkit/compile.sh
    
    - name: Extract version information
      id: version
      run: |
        XCCONFIG_NAME=Letterpress/Version.xcconfig
        if [ ! -f $XCCONFIG_NAME ]; then
          echo "Versioning configuration not found!"
          exit 1
        fi
        VERSION=$(cat $XCCONFIG_NAME | grep 'VERSION =' | awk -F "=" '/VERSION/ {print $2}' | tr -d ' ')
        BUILD_NUMBER=$(cat $XCCONFIG_NAME | grep 'BUILD_NUMBER =' | awk -F "=" '/BUILD_NUMBER/ {print $2}' | tr -d ' ')
        TAG_NAME="v$VERSION-$BUILD_NUMBER"
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        
        echo "Version: $VERSION"
        echo "Build Number: $BUILD_NUMBER"
        echo "Tag Name: $TAG_NAME"
    
    - name: Upload Letterpress.xcarchive to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Letterpress-xcarchive-${{ steps.version.outputs.tag_name }}
        path: Letterpress.xcarchive/
        retention-days: 30
    
    - name: Upload packages to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Letterpress-packages-${{ steps.version.outputs.tag_name }}
        path: packages/
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: Letterpress ${{ steps.version.outputs.version }} Build ${{ steps.version.outputs.build_number }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          packages/*.tipa
        body: |
          ## Letterpress Release ${{ steps.version.outputs.version }}
          
          **Build Number:** ${{ steps.version.outputs.build_number }}
          **Tag:** ${{ steps.version.outputs.tag_name }}
          
          ### Download Options
          - `Letterpress_${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}.tipa` - Standard version
          
          ### Installation
          Install using your preferred sideloading tool (AltStore, Sideloadly, etc.)
          
          ---
          *This release was automatically generated by GitHub Actions.*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number:** ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tag:** ${{ steps.version.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Archive:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- **Packages:** Available in artifacts and release" >> $GITHUB_STEP_SUMMARY
